input {
  file {
    path => "/usr/share/logstash/sample-logs/**/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "json_log"
  }

  file {
    path => "/usr/share/logstash/sample-logs/**/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "text_log"
  }
}

filter {
  if [type] == "text_log" {
    # Grok pattern for standard application text logs
    grok {
      match => {
        "message" => "^(?<log_timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY}\s+%{TIME})\s+%{LOGLEVEL:level}\s+\[(?<service>[^\]]+)\]\s+(?<log_message>.*)$"
      }
    }

    # Fallback grok for Linux syslog format
    if "_grokparsefailure" in [tags] {
      grok {
        match => {
          "message" => "^(?<log_timestamp>%{TIMESTAMP_ISO8601})\s+%{HOSTNAME:host}\s+%{NOTSPACE:service}(?:\[%{NUMBER:pid}\])?:\s*(?<log_message>.*)$"
        }
        remove_tag => ["_grokparsefailure"]
      }
    }
  }

  # Normalize timestamp to Elasticsearch @timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  } else if [log_timestamp] {
    date {
      match => [ "log_timestamp", "YYYY-MM-dd HH:mm:ss", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Severity normalization
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "log-analyzer-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
